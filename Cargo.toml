[workspace]
members = [
    "crates/lume-core",
    "crates/lume-syntax",
    "crates/lume-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nicolas Dias <nicolasbhgamer@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lume-ide/lume"

[workspace.dependencies]
ropey = "1.6"
crossbeam-channel = "0.5"
crossterm = "0.29"
thiserror = "2.0"
criterion = "0.5"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
